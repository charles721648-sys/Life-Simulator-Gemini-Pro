<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生分支模擬器 🎮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        /* Custom Scrollbar for the log */
        #event-log::-webkit-scrollbar {
            width: 8px;
        }
        #event-log::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 8px;
        }
        #event-log::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 8px;
        }
        #event-log::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .stat-bar-container {
            transition: width 0.5s ease-in-out;
        }
        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.4s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">

    <!-- Main Game Container -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col h-[90vh] max-h-[850px]">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 text-center relative shadow-md">
            <h1 class="text-2xl font-black tracking-wider">🧬 人生分支模擬器</h1>
            <p class="text-indigo-200 text-sm mt-1">你的選擇，決定你荒謬的一生</p>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 space-y-6">
            <div class="text-6xl">👶</div>
            <h2 class="text-2xl font-bold text-gray-800 text-center">準備好投胎了嗎？</h2>
            <p class="text-gray-500 text-center">系統將隨機分配你的出生身分，祝你好運。</p>
            <button onclick="startGame()" class="mt-4 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 text-lg">
                🎲 點我隨機投胎
            </button>
        </div>

        <!-- Game Interface (Hidden initially) -->
        <div id="game-screen" class="hidden flex-1 flex flex-col overflow-hidden">
            
            <!-- Top Status Bar -->
            <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center shrink-0">
                <div>
                    <div class="text-3xl font-black text-indigo-700 leading-none"><span id="ui-age">0</span> <span class="text-lg text-gray-500 font-bold">歲</span></div>
                    <div id="ui-background" class="text-sm font-bold text-gray-600 mt-1 bg-gray-200 px-2 py-1 rounded-md inline-block">身分：普通人</div>
                </div>
            </div>

            <!-- Stats Panel -->
            <div class="grid grid-cols-2 gap-4 p-4 shrink-0 bg-white shadow-sm z-10">
                <!-- Health -->
                <div>
                    <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                        <span>❤️ 健康</span>
                        <span id="val-health">100/100</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="bar-health" class="bg-red-500 h-2.5 rounded-full stat-bar-container" style="width: 100%"></div>
                    </div>
                </div>
                <!-- Wealth -->
                <div>
                    <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                        <span>💰 財富</span>
                        <span id="val-wealth">50/100</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="bar-wealth" class="bg-yellow-400 h-2.5 rounded-full stat-bar-container" style="width: 50%"></div>
                    </div>
                </div>
                <!-- Happiness -->
                <div>
                    <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                        <span>😊 快樂</span>
                        <span id="val-happiness">50/100</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="bar-happiness" class="bg-pink-400 h-2.5 rounded-full stat-bar-container" style="width: 50%"></div>
                    </div>
                </div>
                <!-- Intelligence -->
                <div>
                    <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                        <span>🧠 智力</span>
                        <span id="val-intel">50/100</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="bar-intel" class="bg-blue-500 h-2.5 rounded-full stat-bar-container" style="width: 50%"></div>
                    </div>
                </div>
            </div>

            <!-- Interactive Area -->
            <div class="flex-1 flex flex-col p-4 bg-gray-100 overflow-hidden">
                
                <!-- Event Log (Scrollable) -->
                <div id="event-log" class="flex-1 overflow-y-auto mb-4 space-y-3 p-2 bg-white rounded-xl shadow-inner border border-gray-200 relative">
                    <!-- Logs go here -->
                </div>

                <!-- Current Action Panel -->
                <div id="action-panel" class="shrink-0 bg-white p-5 rounded-2xl shadow-lg border border-indigo-100 fade-in">
                    <h3 id="event-title" class="font-bold text-xl text-indigo-800 mb-2">事件標題</h3>
                    <p id="event-desc" class="text-gray-700 text-sm mb-4 min-h-[3rem]">事件描述內容...</p>
                    <div id="choices-container" class="grid grid-cols-1 gap-2">
                        <!-- Choice Buttons generated by JS -->
                    </div>
                </div>

            </div>
        </div>

        <!-- Game Over Screen (Hidden initially) -->
        <div id="game-over-screen" class="hidden flex-1 flex flex-col items-center justify-center p-8 bg-gray-900 text-white space-y-6">
            <div class="text-7xl">🪦</div>
            <h2 class="text-3xl font-black text-red-500">人生登出</h2>
            <div class="bg-gray-800 p-6 rounded-xl w-full max-w-sm border border-gray-700">
                <p class="text-center text-gray-400 text-sm mb-2">最終享年</p>
                <p class="text-center text-4xl font-bold text-white mb-4"><span id="final-age">0</span> 歲</p>
                <div class="border-t border-gray-700 pt-4 mt-2">
                    <p class="text-sm text-gray-400">墓誌銘 / 人生總結：</p>
                    <p id="summary-text" class="text-lg font-bold text-indigo-300 mt-2 text-center">...</p>
                </div>
            </div>
            <button onclick="location.reload()" class="mt-4 px-8 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-full shadow-lg transform transition hover:scale-105">
                🔄 重新投胎
            </button>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>

        const backgrounds = [

            { name: "貧民窟的天才", desc: "出生在漏水的鐵皮屋，但你3歲就會解微積分，只是常吃不飽。", h: 40, w: 5, ha: 40, i: 100 },
            { name: "異世界轉生者", desc: "保留了前世記憶，試圖尋找魔法但發現這世界只有慣老闆。", h: 60, w: 40, ha: 80, i: 85 },

            { name: "平凡到不行的普通人", desc: "超級無敵普通。長相普通，家境普通，連抓周都抓到一塊橡皮擦。", h: 60, w: 50, ha: 50, i: 50 },

        const unexpectedEvents = [

            { title: "走在路上被外星人綁架", desc: "一道光把你吸上飛碟，他們改造了你的大腦才把你丟回來。", effects: {h: -20, w: 0, ha: 0, i: 50}, msg: "覺得腦袋異常清晰，但身體怪怪的。" },
            { title: "中樂透頭獎", desc: "隨手買的一張彩券竟然中了頭獎！", effects: {h: 0, w: 100, ha: 50, i: 0}, msg: "財富自由啦！" },
            { title: "吃到過期便當", desc: "拉肚子拉了三天三夜，差點看見阿嬤在河對岸招手。", effects: {h: -30, w: 0, ha: -20, i: 0}, msg: "健康大幅下降..." }
        ];

        const normalScenarios = [
            // Age 0-12
            { min: 0, max: 3, title: "抓周大典", desc: "長輩們把你放在一堆物品前，你決定爬向...", choices: [

            { min: 16, max: 18, title: "初戀告白", desc: "隔壁班的班花/班草跟你告白了！", choices: [
                { text: "答應交往", effects: {h: 0, w: -10, ha: 30, i: -10}, msg: "沉浸在粉紅泡泡中，無心讀書，花了不少約會錢。" },
                { text: "狠心拒絕", effects: {h: 0, w: 0, ha: -20, i: 10}, msg: "你心中只有課業（或遊戲），單身萬歲。" },
                { text: "當工具人", effects: {h: -10, w: -20, ha: -10, i: -5}, msg: "你以為你們在曖昧，其實你只是個買早餐的。" }

            // Age 19-25
            { min: 19, max: 22, title: "大學生活", desc: "上了大學，沒人管你了，你的生活重心是...", choices: [
                { text: "瘋狂夜衝夜唱", effects: {h: -20, w: -15, ha: 30, i: -10}, msg: "肝指數飆高，但留下了青春的回憶。" },
                { text: "加入投資社團", effects: {h: 0, w: 20, ha: -5, i: 15}, msg: "提早學習理財，小賺了一筆。" },

            // Age 26-40

            { min: 71, max: 80, title: "浴室滑倒", desc: "洗澡時一個不小心滑倒了...", choices: [
                { text: "按緊急求救鈴", effects: {h: -20, w: -10, ha: 0, i: 0}, msg: "叫了救護車，幸好沒大礙，但花了醫藥費。" },
                { text: "爬起來裝沒事", effects: {h: -50, w: 0, ha: -10, i: 0}, msg: "硬撐結果引發內出血，健康極度惡化！" },
                { text: "大喊救命", effects: {h: -15, w: 0, ha: 0, i: 5}, msg: "剛好鄰居來借醬油聽到了，救了你一命。" }
            ]},
            { min: 81, max: 100, title: "風中殘燭", desc: "身體機能退化，大部分時間都在床上度過...", choices: [
                { text: "回憶平生", effects: {h: -10, w: 0, ha: 20, i: 10}, msg: "回顧一生，覺得也算是精采過了。" },
                { text: "立下遺囑", effects: {h: -5, w: 0, ha: 0, i: 10}, msg: "把剩下的錢全捐給流浪動物之家，子孫氣炸。" },
                { text: "安詳等待", effects: {h: -20, w: 0, ha: 0, i: 0}, msg: "看著窗外的落葉，感覺時間慢慢停止..." }
            ]}
        ];

        // --- Game State ---
        let player = {
            age: 0,
            bg: null,
            health: 100,
            wealth: 50,
            happiness: 50,
            intel: 50,
            maxAge: 85,
            isDead: false
        };

        // --- Core Functions ---

        function clamp(val) {
            return Math.max(0, Math.min(100, val));
        }

        function updateUI() {
            document.getElementById('ui-age').innerText = player.age;
            
            // Values
            document.getElementById('val-health').innerText = `${player.health}/100`;
            document.getElementById('val-wealth').innerText = `${player.wealth}/100`;
            document.getElementById('val-happiness').innerText = `${player.happiness}/100`;
            document.getElementById('val-intel').innerText = `${player.intel}/100`;

            // Bars
            document.getElementById('bar-health').style.width = `${player.health}%`;
            document.getElementById('bar-wealth').style.width = `${player.wealth}%`;
            document.getElementById('bar-happiness').style.width = `${player.happiness}%`;
            document.getElementById('bar-intel').style.width = `${player.intel}%`;

            // Bar Colors (Warning states)
            document.getElementById('bar-health').className = `h-2.5 rounded-full stat-bar-container ${player.health < 30 ? 'bg-red-700 animate-pulse' : 'bg-red-500'}`;
        }

        function addLog(text, isEvent = false) {
            const logBox = document.getElementById('event-log');
            const entry = document.createElement('div');
            entry.className = `text-sm p-3 rounded-lg border-l-4 ${isEvent ? 'border-yellow-400 bg-yellow-50 text-yellow-900 font-bold' : 'border-indigo-400 bg-gray-50 text-gray-800'}`;
            
            entry.innerHTML = `<span class="text-indigo-600 font-bold mr-2">[${player.age}歲]</span> ${text}`;
            logBox.appendChild(entry);
            
            // Auto scroll to bottom
            logBox.scrollTop = logBox.scrollHeight;
        }

        function startGame() {
            // Setup Random Background
            const bgIndex = Math.floor(Math.random() * backgrounds.length);
            player.bg = backgrounds[bgIndex];
            
            player.age = 0;
            player.health = player.bg.h;
            player.wealth = player.bg.w;
            player.happiness = player.bg.ha;
            player.intel = player.bg.i;
            player.isDead = false;
            // Random death age between 70 and 100
            player.maxAge = Math.floor(Math.random() * 31) + 70; 

            document.getElementById('event-log').innerHTML = ''; // Clear logs
            
            // Switch Screens
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('ui-background').innerText = `身分：${player.bg.name}`;
            
            updateUI();
            
            addLog(`【開局】你出生了！身分是「${player.bg.name}」。<br><span class="text-xs text-gray-500">${player.bg.desc}</span>`);
            
            nextTurn(true);
        }

        function checkDeath() {
            if (player.health <= 0) {
                player.health = 0;
                player.isDead = true;
                return "健康值歸零，你病逝了。";
            }
            if (player.age >= player.maxAge) {
                player.isDead = true;
                return "壽終正寢，你安詳地離開了這個世界。";
            }
            return false;
        }

        function generateSummary() {
            let title = "";
            if (player.wealth >= 90) title = "💰 頂級大富翁";
            else if (player.wealth <= 10) title = "🗑️ 窮苦一生";
            else if (player.intel >= 90) title = "🧠 愛因斯坦再世";
            else if (player.happiness >= 90) title = "🌞 樂天派宗師";
            else if (player.health <= 20 && player.age < 50) title = "🥀 英年早逝";
            else title = "😐 平凡的一生";

            return `【${title}】<br>出生為「${player.bg.name}」，活到了 ${player.age} 歲。<br>雖然經歷了種種抉擇，但人生就是如此。`;
        }

        function gameOver(reason) {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            
            document.getElementById('final-age').innerText = player.age;
            document.getElementById('summary-text').innerHTML = `${reason}<br><br>${generateSummary()}`;
        }

        function triggerUnexpectedEvent() {
            const ev = unexpectedEvents[Math.floor(Math.random() * unexpectedEvents.length)];
            
            // Update panel
            document.getElementById('event-title').innerText = `⚠️ 突發事件：${ev.title}`;
            document.getElementById('event-desc').innerText = ev.desc;
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            
            const btn = document.createElement('button');
            btn.className = "w-full text-left p-4 bg-yellow-100 hover:bg-yellow-200 text-yellow-900 border border-yellow-300 rounded-xl transition duration-200 font-bold";
            btn.innerText = "接受命運";
            btn.onclick = () => {
                applyEffects(ev.effects);
                addLog(`遇到突發事件【${ev.title}】。${ev.msg}`, true);
                updateUI();
                
                const deathReason = checkDeath();
                if (deathReason) {
                    gameOver(deathReason);
                } else {
                    nextTurn(false);
                }
            };
            container.appendChild(btn);
        }

        function nextTurn(isFirst = false) {
            // Remove animation class to reset
            const panel = document.getElementById('action-panel');
            panel.classList.remove('fade-in');
            void panel.offsetWidth; // Trigger reflow
            panel.classList.add('fade-in');

            if (!isFirst) {
                // Advance age by 3 to 5 years
                const ageJump = Math.floor(Math.random() * 3) + 3;
                player.age += ageJump;
                updateUI();

                const deathReason = checkDeath();
                if (deathReason) {
                    gameOver(deathReason);
                    return;
                }

                // 25% chance for unexpected event
                if (Math.random() < 0.25) {
                    triggerUnexpectedEvent();
                    return;
                }
            }

            // Normal Scenario Selection based on Age
            let availableScenarios = normalScenarios.filter(s => player.age >= s.min && player.age <= s.max);
            
            if (availableScenarios.length === 0) {
                // Fallback generic event if missing age brackets
                availableScenarios = [{
                    title: "平靜的幾年",
                    desc: "日子一天天過去，沒什麼特別的事情發生。",
                    choices: [
                        { text: "認真生活", effects: {h: 5, w: 5, ha: 0, i: 0}, msg: "平淡是福。" },
                        { text: "耍廢", effects: {h: -5, w: -5, ha: 5, i: 0}, msg: "耍廢一時爽，一直耍廢一直爽。" }
                    ]
                }];
            }

            const scenario = availableScenarios[Math.floor(Math.random() * availableScenarios.length)];
            
            // Render UI
            document.getElementById('event-title').innerText = scenario.title;
            document.getElementById('event-desc').innerText = scenario.desc;
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            scenario.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 bg-gray-50 hover:bg-indigo-50 text-gray-800 border border-gray-200 hover:border-indigo-300 rounded-xl transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center justify-between";
                btn.innerHTML = `<span>${choice.text}</span> <span class="text-indigo-400 text-sm">選擇 👉</span>`;
                btn.onclick = () => handleChoice(scenario, choice);
                container.appendChild(btn);
            });
        }

        function applyEffects(effects) {
            player.health = clamp(player.health + effects.h);
            player.wealth = clamp(player.wealth + effects.w);
            player.happiness = clamp(player.happiness + effects.ha);
            player.intel = clamp(player.intel + effects.i);
        }

        function handleChoice(scenario, choice) {
            applyEffects(choice.effects);
            
            // Build Log string
            let logMsg = `【${scenario.title}】選擇了「${choice.text}」。<br><span class="text-gray-500">${choice.msg}</span>`;
            addLog(logMsg);
            
            updateUI();

            const deathReason = checkDeath();
            if (deathReason) {
                setTimeout(() => gameOver(deathReason), 800); // slight delay for visual
            } else {
                nextTurn(false);
            }
        }

    </script>
</body>
</html>
